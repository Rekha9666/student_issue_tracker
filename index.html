<!DOCTYPE html>
<html>
<head>
  <title>Student Issue Tracker</title>
</head>
<body>
  <h1>Student Issue Tracker</h1>

  <!-- Login / Signup Form -->
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="loginBtn">Login</button>
  <button id="signupBtn">Sign Up</button>

  <!-- Issue Form -->
  <input id="issueTitle" type="text" placeholder="Issue Title">
  <textarea id="issueDesc" placeholder="Issue Description"></textarea>
  <button id="submitIssueBtn">Submit Issue</button>

  <!-- Display Issues -->
  <div id="issuesList"></div>

  <!-- Link to JS -->
  <script type="module" src="script.js"></script>
</body>
</html>
